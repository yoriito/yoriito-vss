name: generate vss outputs

permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate-vss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Check if already auto-generated
        id: skipcheck
        run: |
          if git log -1 --pretty=%B | grep -q '\[auto-generated\]'; then
            echo "Already auto-generated. Skipping."
            echo "is_recursive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run generate script
        if: steps.skipcheck.outputs.is_recursive != 'true'
        run: |
          sudo apt install pipx
          ./scripts/create_vspec.sh

      - name: Check for changes
        id: changes
        if: steps.skipcheck.outputs.is_recursive != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' && steps.skipcheck.outputs.is_recursive != 'true'
        run: |
          git add .
          git commit -m "chore: auto-generated files [auto-generated]"
          git push origin HEAD:${{ github.head_ref }}