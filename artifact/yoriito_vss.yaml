Vehicle.Powertrain.TractionBattery.TimeRemaining:
  datatype: uint32
  description: Time remaining in seconds before the battery is empty.
  type: sensor
  unit: s

Vehicle.Powertrain.TractionBattery.TotalCurrentPower:
  datatype: float
  description: Total current electrical energy flowing in/out of battery. Positive = Energy flowing in to battery, e.g. during charging. Negative = Energy flowing out of battery, e.g. during driving.
  type: sensor
  unit: W

Vehicle.Powertrain.TractionBattery.TotalElectricity:
  datatype: Types.Electricity
  description: Total current voltage and current of the battery. Positive current = Current flowing in to battery, e.g. during charging. Negative current = Current flowing out of battery, e.g. during driving.
