  - IEC_TYPE_1_CCS_DC
  - IEC_TYPE_2_CCS_DC
  - NACS_AC
  - NACS_DC
  - GBT_AC
  - GBT_DC
  - OTHER
  comment: A vehicle may have multiple charging ports. IEC_TYPE_1_AC refers to Type 1 as defined in IEC 62196-2. IEC_TYPE_2_AC refers to Type 2 as defined in IEC 62196-2. IEC_TYPE_3_AC refers to Type 3 as defined in IEC 62196-2. IEC_TYPE_4_DC refers to AA configuration as defined in IEC 62196-3. Also known as Type 4 or CHAdeMO connector. IEC_TYPE_1_CCS_DC refers to EE Configuration as defined in IEC 62196-3. Also known as CCS1 or Combo1 connector. IEC_TYPE_2_CCS_DC refers to FF Configuration as defined in IEC 62196-3. Also known as CCS2 or Combo2 connector. NACS_AC and NACS_DC refer to charging ports/methods based on NACS (North American Charging Standard). GBT_AC refers to connector specified in GB/T 20234.2. GBT_DC refers to connector specified in GB/T 20234.3. Also specified as BB Configuration in IEC 62196-3. OTHER shall be used for charging ports not included in the list above. For additional information see https://en.wikipedia.org/wiki/IEC_62196.
  datatype: string[]
  description: A list of the supported (i.e., available) charging inlets in a particular charging port. IEC types refer to IEC 62196,  GBT refers to  GB/T 20234.
  type: attribute

