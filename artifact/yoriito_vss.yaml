Vehicle.MotionManagement.Suspension.Axle.Row2.Wheel.Right.DampingForce:
  comment: Alternative signal to DampingRate.
  datatype: int16
  description: Actuated damping force at given wheel. Signal orientation according ISO8855, meaning positive force is pointing upwards.
  type: sensor
  unit: N

Vehicle.MotionManagement.Suspension.Axle.Row2.Wheel.Right.DampingForceTarget:
