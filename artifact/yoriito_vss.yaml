Vehicle.VehicleIdentification.PurchaseDate:
  datatype: string
  description: The date in ISO 8601 format of the item e.g. vehicle was purchased by the current owner.
  type: attribute
  unit: iso8601

Vehicle.VehicleIdentification.VIN:
  datatype: string
