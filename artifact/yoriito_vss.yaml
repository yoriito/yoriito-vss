  datatype: uint8
  description: Item position. 0 = Start position 100 = End position.
  max: 100
  min: 0
  type: actuator
  unit: percent

Vehicle.Cabin.Sunroof.Slide:
  datatype: uint8
  description: Sunroof slide position as a percent. 0 = Fully closed, 100 = Fully opened. In implementations where the tilt position is located beyond the fully closed position, the slide value remains 0 while moving between the fully closed and tilt positions. See Vehicle.Cabin.Sunroof.Tilt for details.
  max: 100
  min: 0
  type: actuator
  unit: percent

Vehicle.Cabin.Sunroof.Tilt:
  datatype: uint8
  description: Sunroof tilt position as a percent. 0 = Fully closed, 100 = Fully tilted. The relationship between tilt and slide positions is vehicle dependent. If the tilt position is located between the fully closed and fully opened positions, the tilt value changes from 0 to 100 as the slide position changes and remains at 100 after the tilt position is reached. If the tilt position is located beyond the fully closed position, negative tilt positions are not represented and the tilt value remains 0 during slide movement between the fully opened and fully closed positions.
  max: 100
  min: 0
  type: actuator
  unit: percent

