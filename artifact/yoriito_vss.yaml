ComplexDataTypes:
  Types:
    description: These are VSSs defined as struct types.
    type: branch
  Types.Acceleration:
    description: Spatial acceleration. Axis definitions according to ISO 8855.
    type: struct
  Types.Acceleration.Lateral:
    datatype: float
    description: Vehicle acceleration in Y (lateral acceleration). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: m/s^2
  Types.Acceleration.Longitudinal:
    datatype: float
    description: Vehicle acceleration in X (longitudinal acceleration). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: m/s^2
  Types.Acceleration.Vertical:
    datatype: float
    description: Vehicle acceleration in Z (vertical acceleration). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: m/s^2
  Types.AngularVelocity:
    description: Spatial rotation. Axis definitions according to ISO 8855.
    type: struct
  Types.AngularVelocity.Pitch:
    datatype: float
    description: Vehicle rotation rate along Y (lateral). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: degrees/s
  Types.AngularVelocity.Roll:
    datatype: float
    description: Vehicle rotation rate along X (longitudinal). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: degrees/s
  Types.AngularVelocity.Yaw:
    datatype: float
    description: Vehicle rotation rate along Z (vertical). An IEEE 754-compliant NaN value shall indicate an invalid or unsupported value, e.g., when the vehicle does not support a particular axis.
    type: property
    unit: degrees/s
  Types.Electricity:
    description: Electrical conditions of the circuits, including voltage and current.
    type: struct
  Types.Electricity.Current:
    datatype: float
    description: Current flowing in/out of circuits. Positive = Current flowing in to circuits. Negative = Current flowing out of circuits.
    type: property
    unit: A
  Types.Electricity.Voltage:
    datatype: float
    description: Voltage of the circuits.
    type: property
    unit: V
  Types.GNSSLocation:
    description: GNSS positioning information according to ISO 23150=2023.
    type: struct
  Types.GNSSLocation.Altitude:
    datatype: double
    description: Current altitude relative to WGS 84 reference ellipsoid.
    type: property
    unit: m
  Types.GNSSLocation.FixType:
    allowed:
    - NONE
    - TWO_D
    - TWO_D_SATELLITE_BASED_AUGMENTATION
    - TWO_D_GROUND_BASED_AUGMENTATION
    - TWO_D_SATELLITE_AND_GROUND_BASED_AUGMENTATION
    - THREE_D
    - THREE_D_SATELLITE_BASED_AUGMENTATION
    - THREE_D_GROUND_BASED_AUGMENTATION
    - THREE_D_SATELLITE_AND_GROUND_BASED_AUGMENTATION
    datatype: string
    description: Fix status.An IEEE 754‑compliant NaN value shall indicate an invalid or unsupported value. When this signal has the value NONE, all other signals within the struct shall be set to NaN. When the value is TWO_D or TWO_D_XXX, the Altitude and VerticalAccuracy signals shall be set to NaN.
    type: property
  Types.GNSSLocation.HorizontalAccuracy:
    datatype: double
    description: Accuracy of the latitude and longitude coordinates.
    type: property
    unit: m
  Types.GNSSLocation.Latitude:
    datatype: double
    description: Current latitude of vehicle in WGS 84 geodetic coordinates.
    max: 90
    min: -90
    type: property
    unit: degrees
  Types.GNSSLocation.Longitude:
    datatype: double
    description: Current longitude of vehicle in WGS 84 geodetic coordinates.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.GNSSLocation.Timestamp:
    datatype: string
    description: Timestamp for current location, formatted according to ISO 8601 with UTC time zone.
    type: property
    unit: iso8601
  Types.GNSSLocation.VerticalAccuracy:
    datatype: double
    description: Accuracy of altitude.
    type: property
    unit: m
  Types.Location:
    description: A specified geographic location.
    type: struct
  Types.Location.Altitude:
    datatype: double
    description: Altitude of the specified location relative to the WGS 84 reference ellipsoid.
    type: property
    unit: m
  Types.Location.Latitude:
    datatype: double
    description: Latitude of the specified location in WGS 84 geodetic coordinates.
    max: 90
    min: -90
    type: property
    unit: degrees
  Types.Location.Longitude:
    datatype: double
    description: Longitude of the specified location in WGS 84 geodetic coordinates.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.PointingDirection:
    description: Direction from object reference point to the target point indicated by the object.
    type: struct
  Types.PointingDirection.Azimuth:
    datatype: float
    description: Object azimuth pointing angle (right-hand rule) on vehicle sprung mass Z-axis as defined by ISO 23150:2023. 0 = Object pointing forward. Positive values = Object pointing toward the left side of the vehicle. Negative values = Object pointing toward the right side of the vehicle.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.PointingDirection.Elevation:
    datatype: float
    description: Elevation to target point measured as angle between the vehicle sprung mass XY-plane as defined by ISO 23150:2023 at the object reference point and the direction to the target point. 0 = Object pointing at a target at the same height as the object reference point. Positive values = Object pointing at a target above the object reference point. Negative values = Object pointing at a target below the object reference point.
    max: 90
    min: -90
    type: property
    unit: degrees
  Types.Pose:
    description: The current position of the object reference point on vehicle axis according to ISO 23150:2023.
    type: struct
  Types.Pose.Pitch:
    datatype: float
    description: Object pitch angle, measured as angle from vehicle sprung mass XY-plane as defined by ISO 23150:2023 to the object X-axis. 0 = Object in nominal orientation. Positive values = Object tilted up. Negative values = Object tilted down.
    max: 90
    min: -90
    type: property
    unit: degrees
  Types.Pose.Roll:
    datatype: float
    description: Object roll angle about the object X-axis (right-hand rule). 0 = Object in nominal orientation. Positive values = Object tilted to the right. Negative values = Object tilted to the left.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.Pose.X:
    datatype: int16
    description: Longitudinal position of object reference point measured on the X-axis of the vehicle rear-axle coordinate system as defined by ISO 23150:2023. The object reference point refers to a representative point of the object. Positive values = forward of (first) rear-axle. Negative values = backward of (first) rear-axle.
    type: property
    unit: mm
  Types.Pose.Y:
    datatype: int16
    description: Lateral position of object reference point measured on the Y-axis of the vehicle rear-axle coordinate system as defined by ISO 23150:2023. The object reference point refers to a representative point of the object. Positive values = left of rear-axle center. Negative values = right of rear-axle center.
    type: property
    unit: mm
  Types.Pose.Yaw:
    datatype: float
    description: Object yaw angle, measured from the vehicle sprung mass X-axis as defined by ISO 23150:2023 to the object X-axis, around the vehicle Z-axis (right-hand rule). 0 = Object in nominal orientation. Positive values = Object rotated left. Negative values = Object rotated right.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.Pose.Z:
    datatype: int16
    description: Height position of object reference point measured on the Z-axis of the vehicle rear-axle coordinate system as defined by ISO 23150:2023. The object reference point refers to a representative point of the object. Positive values = above center of rear-axle reference point. Negative values = below center of rear-axle reference point.
    type: property
    unit: mm
  Types.RoadFrictionRange:
    description: Road friction values reported by the ESC system.
    type: struct
  Types.RoadFrictionRange.LowerBound:
    datatype: float
    description: Lower bound road friction, as calculated by the ESC system. 5% possibility that road friction is below this value. 0 = no friction, 100 = maximum friction.
    max: 100
    min: 0
    type: property
    unit: percent
  Types.RoadFrictionRange.MostProbable:
    datatype: float
    description: Most probable road friction, as calculated by the ESC system. Exact meaning of most probable is implementation specific. 0 = no friction, 100 = maximum friction.
    max: 100
    min: 0
    type: property
    unit: percent
  Types.RoadFrictionRange.UpperBound:
    datatype: float
    description: Upper bound road friction, as calculated by the ESC system. 95% possibility that road friction is below this value. 0 = no friction, 100 = maximum friction.
    max: 100
    min: 0
    type: property
    unit: percent
  Types.ThreePhaseCurrentMeasurements:
    description: AC current (rms) measurements for Phase 1, Phase 2, and Phase 3.
    type: struct
  Types.ThreePhaseCurrentMeasurements.Phase1:
    datatype: float
    description: AC current (rms) for Phase 1.
    type: property
    unit: A
  Types.ThreePhaseCurrentMeasurements.Phase2:
    datatype: float
    description: AC current (rms) for Phase 2.
    type: property
    unit: A
  Types.ThreePhaseCurrentMeasurements.Phase3:
    datatype: float
    description: AC current (rms) for Phase 3.
    type: property
    unit: A
  Types.ThreePhaseVoltageMeasurements:
    description: AC voltage (rms) measurements for Phase 1, Phase 2, and Phase 3.
    type: struct
  Types.ThreePhaseVoltageMeasurements.Phase1:
    datatype: float
    description: AC voltage (rms) for Phase 1.
    type: property
    unit: V
  Types.ThreePhaseVoltageMeasurements.Phase2:
    datatype: float
    description: AC voltage (rms) for Phase 2.
    type: property
    unit: V
  Types.ThreePhaseVoltageMeasurements.Phase3:
    datatype: float
    description: AC voltage (rms) for Phase 3.
    type: property
    unit: V
  Types.VehicleLocation:
    description: Information for vehicle location. An IEEE 754‑compliant NaN value shall indicate an invalid or unsupported value. When dead reckoning is not enabled, all values shall be set to NaN.
    type: struct
  Types.VehicleLocation.Altitude:
    datatype: double
    description: Current altitude relative to WGS 84 reference ellipsoid.
    type: property
    unit: m
  Types.VehicleLocation.Heading:
    datatype: double
    description: Current heading relative to geographic north. 0 = North, 90 = East, 180 = South, 270 = West.
    max: 360
    min: 0
    type: property
    unit: degrees
  Types.VehicleLocation.HorizontalAccuracy:
    datatype: double
    description: Accuracy of the latitude and longitude coordinates.
    type: property
    unit: m
  Types.VehicleLocation.Latitude:
    datatype: double
    description: Current latitude of vehicle in WGS 84 geodetic coordinates.
    max: 90
    min: -90
    type: property
    unit: degrees
  Types.VehicleLocation.Longitude:
    datatype: double
    description: Current longitude of vehicle in WGS 84 geodetic coordinates.
    max: 180
    min: -180
    type: property
    unit: degrees
  Types.VehicleLocation.Timestamp:
    datatype: string
    description: Timestamp for current location, formatted according to ISO 8601 with UTC time zone.
    type: property
    unit: iso8601
  Types.VehicleLocation.VerticalAccuracy:
    datatype: double
    description: Accuracy of altitude.
    type: property
    unit: m

Vehicle:
  description: High-level vehicle data.
  type: branch

Vehicle.ADAS:
  description: All Advanced Driver Assist Systems data.
  type: branch

Vehicle.ADAS.ABS:
  description: Antilock Braking System signals.
  type: branch

Vehicle.ADAS.ABS.IsEnabled:
  datatype: boolean
  description: Indicates if ABS is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.ABS.IsEngaged:
  datatype: boolean
  description: Indicates if ABS is currently regulating brake pressure. True = Engaged. False = Not Engaged.
  type: sensor

Vehicle.ADAS.ActiveAutonomyLevel:
  allowed:
  - SAE_0
  - SAE_1
  - SAE_2_DISENGAGING
  - SAE_2
  - SAE_3_DISENGAGING
  - SAE_3
  - SAE_4_DISENGAGING
  - SAE_4
  - SAE_5_DISENGAGING
  - SAE_5
  comment: Complies with https://www.sae.org/standards/content/j3016_202104/ and https://www.sae.org/blog/sae-j3016-update. Level 5 and 4 ADS (Automated driving system) disengage, if appropriate, only after it achieves a minimal risk condition or a driver is performing the DDT. Level 3 ADS disengages either an appropriate time after issuing a request to intervene or immediately upon user request. Level 2 DAS (Driving automation system) disengages immediately upon driver request. However, since many Level 2 DAS, often termed "Level 2.5", warn the driver shortly before reaching their operational limits, the VSS also supports the DISENGAGING state for SAE_2. Nevertheless, it should be noted that the SAE J3016 states that it is incorrect to describe driving automation features using fractional levels.
  datatype: string
  description: Indicates the currently active level of driving automation according to the SAE J3016 (Taxonomy and Definitions for Terms Related to Driving Automation Systems for On-Road Motor Vehicles).
  type: sensor

Vehicle.ADAS.CruiseControl:
  description: Signals from Cruise Control system.
  type: branch

Vehicle.ADAS.CruiseControl.AdaptiveDistanceSet:
  datatype: float
  description: Distance in meters to keep from lead vehicle
  min: 0.0
  type: actuator
  unit: m

Vehicle.ADAS.CruiseControl.AdaptiveIntervalSet:
  allowed:
  - INTVL_1
  - INTVL_2
  - INTVL_3
  - INTVL_4
  - INTVL_5
  datatype: string
  description: Set the following distance for adaptive cruise control. INTVL_1 indicates the shortest following distance.
  type: actuator

Vehicle.ADAS.CruiseControl.DegradationStatus:
  allowed:
  - NO_DEGRADATION
  - CONTAMINATION
  - OTHER
  datatype: string
  description: Indicates the current functional limitation or performance degradation status of Cruise Control. This status may include non-fault conditions such as temporary limitations, reduced performance, or fallback modes.
  type: sensor

Vehicle.ADAS.CruiseControl.IsActive:
  datatype: boolean
  description: Indicates if cruise control system is active (i.e. actively controls speed). True = Active. False = Inactive.
  type: actuator

Vehicle.ADAS.CruiseControl.IsAdaptive:
  datatype: boolean
  description: Indicates if cruise control system is adaptive (i.e. actively controls speed).
  type: actuator

Vehicle.ADAS.CruiseControl.IsEnabled:
  datatype: boolean
  description: Indicates if cruise control system is enabled (e.g. ready to receive configurations and settings) True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.CruiseControl.SpeedSet:
  datatype: float
  description: Set cruise control speed in kilometers per hour.
  type: actuator
  unit: km/h

Vehicle.ADAS.DMS:
  description: Driver Monitoring System signals.
  type: branch

Vehicle.ADAS.DMS.DegradationStatus:
  allowed:
  - NO_DEGRADATION
  - CAMERA_LENS_CONTAMINATION
  - OTHER
  datatype: string
  description: Indicates the current functional limitation or performance degradation status of DMS. This status may include non-fault conditions such as temporary limitations, reduced performance, or fallback modes.
  type: sensor

Vehicle.ADAS.DMS.IsEnabled:
  datatype: boolean
  description: Indicates if DMS is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.DMS.IsWarning:
  datatype: boolean
  description: Indicates if DMS has registered a driver alert condition.
  type: sensor

Vehicle.ADAS.EBA:
  description: Emergency Brake Assist (EBA) System signals.
  type: branch

Vehicle.ADAS.EBA.IsEnabled:
  datatype: boolean
  description: Indicates if EBA is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.EBA.IsEngaged:
  datatype: boolean
  description: Indicates if EBA is currently regulating brake pressure. True = Engaged. False = Not Engaged.
  type: sensor

Vehicle.ADAS.EBD:
  description: Electronic Brakeforce Distribution (EBD) System signals.
  type: branch

Vehicle.ADAS.EBD.IsEnabled:
  datatype: boolean
  description: Indicates if EBD is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.EBD.IsEngaged:
  datatype: boolean
  description: Indicates if EBD is currently regulating vehicle brakeforce distribution. True = Engaged. False = Not Engaged.
  type: sensor

Vehicle.ADAS.ESC:
  description: Electronic Stability Control System signals.
  type: branch

Vehicle.ADAS.ESC.IsEnabled:
  datatype: boolean
  description: Indicates if ESC is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.ESC.IsEngaged:
  datatype: boolean
  description: Indicates if ESC is currently regulating vehicle stability. True = Engaged. False = Not Engaged.
  type: sensor

Vehicle.ADAS.ESC.IsStrongCrossWindDetected:
  datatype: boolean
  description: Indicates if the ESC system is detecting strong cross winds. True = Strong cross winds detected. False = No strong cross winds detected.
  type: sensor

Vehicle.ADAS.ESC.RoadFriction:
  datatype: Types.RoadFrictionRange
  description: Road friction values reported by the ESC system.
  type: sensor

Vehicle.ADAS.IsAutoPowerOptimize:
  datatype: boolean
  description: Auto Power Optimization Flag When set to 'true', the system enables automatic power optimization, dynamically adjusting the power optimization level based on runtime conditions or features managed by the OEM. When set to 'false', manual control of the power optimization level is allowed.
  type: actuator

Vehicle.ADAS.LaneDepartureDetection:
  description: Signals from Lane Departure Detection System.
  type: branch

Vehicle.ADAS.LaneDepartureDetection.DegradationStatus:
  allowed:
  - NO_DEGRADATION
  - CAMERA_OBSTRUCTION_DETECTED
  - ENV_CONDITION_BAD
  - OTHER
  datatype: string
  description: Indicates the current functional limitation or performance degradation status of LaneDepartureDetection. This status may include non-fault conditions such as temporary limitations, reduced performance, or fallback modes.
  type: sensor

Vehicle.ADAS.LaneDepartureDetection.IsEnabled:
  datatype: boolean
  description: Indicates if lane departure detection system is enabled. True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.LaneDepartureDetection.IsWarning:
  datatype: boolean
  description: Indicates if lane departure detection registered a lane departure.
  type: sensor

Vehicle.ADAS.ObstacleDetection:
  description: Signals form Obstacle Sensor System.
  type: branch

Vehicle.ADAS.ObstacleDetection.Front:
  description: Signals form Obstacle Sensor System.
  type: branch

Vehicle.ADAS.ObstacleDetection.Front.Center:
  description: Signals form Obstacle Sensor System.
  type: branch

Vehicle.ADAS.ObstacleDetection.Front.Center.DegradationStatus:
  allowed:
  - NO_DEGRADATION
  - SENSOR_BLOCKED
  - CALIBRATION_ERROR
  - SENSOR_MOUNTING_ERROR
  - SENSOR_SIGNAL_CONFLICT
  - ENV_CONDITION_BAD
  - TEMP_ABNORMAL
  datatype: string
  description: Indicates the current functional limitation or performance degradation status of ObstacleDetection. This status may include non-fault conditions such as temporary limitations, reduced performance, or fallback modes.
  type: sensor

Vehicle.ADAS.ObstacleDetection.Front.Center.Distance:
  datatype: float
  description: Distance in meters to detected object. If no object were detected, returns -1.
  min: -1.0
  type: sensor
  unit: m

Vehicle.ADAS.ObstacleDetection.Front.Center.IsEnabled:
  datatype: boolean
  description: Indicates if obstacle sensor system is enabled (i.e. monitoring for obstacles). True = Enabled. False = Disabled.
  type: actuator

Vehicle.ADAS.ObstacleDetection.Front.Center.IsWarning:
  datatype: boolean
  description: Indicates if obstacle sensor system registered an obstacle.
  type: sensor

Vehicle.ADAS.ObstacleDetection.Front.Center.TimeGap:
  datatype: int32
  description: Time in milliseconds before potential impact object. If no object were detected, returns -1.
  type: sensor
  unit: ms

Vehicle.ADAS.ObstacleDetection.Front.Center.WarningType:
  allowed:
  - UNDEFINED
  - CROSS_TRAFFIC
  - BLIND_SPOT
  comment: Undefined obstacle warning type would merely alert of presence of obstacle and may measure distance.
  datatype: string
  description: Indicates the type of obstacle warning detected as some track not only the presence of an obstacle but potential intercepting trajectory or other characteristics.
  type: sensor

